<!doctype html>
<html lang="th">
<head>
  <script src="app-config.js?v=20260901-central-api-1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เพิ่ม/แก้ไขหลักสูตร</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f3f6fb;overflow:hidden;font-family:Arial,sans-serif}
    .admincliproom-frame{display:block;width:100%;height:100vh;border:0;background:#fff}
    .admincliproom-frame[hidden]{display:none}
    .admincliproom-status{height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#123b69;font-weight:700}
    .admincliproom-status.error{color:#b42318}
  </style>
  <link rel="stylesheet" href="theme-modern.css?v=20260902-1">
</head>
<body class="theme-v2">
  <div class="admincliproom-status" id="adminCliproomStatus">กำลังเปิดหน้าจัดการหลักสูตร...</div>
  <iframe id="adminCliproomFrame" class="admincliproom-frame" hidden title="เพิ่ม/แก้ไขหลักสูตร" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
  <script>
  (() => {
    'use strict';
    const MAIN_API_URL = String((window.APP_CONFIG && window.APP_CONFIG.API_URL) || '').trim();
    const status = document.getElementById('adminCliproomStatus');
    const frame = document.getElementById('adminCliproomFrame');

    function resolveCliproomExecUrl() {
        const mainApi = String(MAIN_API_URL || '').trim();
        if (!mainApi) return Promise.reject(new Error('ไม่พบ URL ของ Apps Script หลัก'));
    
        return new Promise((resolve, reject) => {
          const callbackName = '__cliproomExecResolver_' + Date.now() + '_' + Math.random().toString(36).slice(2);
          const script = document.createElement('script');
          let timer = null;
    
          const cleanup = () => {
            if (timer) clearTimeout(timer);
            try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
          };
    
          window[callbackName] = result => {
            try {
              if (!result || result.success === false) {
                throw new Error((result && result.message) || 'อ่าน URL Cliproom จากชีตไม่สำเร็จ');
              }
              const execUrl = String(result.url || '').trim();
              if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec(?:[?#].*)?$/i.test(execUrl)) {
                throw new Error('URL Cliproom จากชีตไม่ถูกต้อง');
              }
              cleanup();
              resolve(execUrl);
            } catch (error) {
              cleanup();
              reject(error);
            }
          };
    
          try {
            const url = new URL(mainApi);
            url.searchParams.set('mode', 'cliproomexec');
            url.searchParams.set('callback', callbackName);
            url.searchParams.set('_t', String(Date.now()));
            script.src = url.toString();
            script.async = true;
            script.onerror = () => {
              cleanup();
              reject(new Error('เชื่อมต่อ Apps Script หลักไม่สำเร็จ'));
            };
            timer = setTimeout(() => {
              cleanup();
              reject(new Error('Apps Script หลักใช้เวลาตอบกลับนานเกินไป'));
            }, 15000);
            document.head.appendChild(script);
          } catch (error) {
            cleanup();
            reject(error);
          }
        });
      }

    resolveCliproomExecUrl().then(execUrl => {
      const target = new URL(execUrl);
      target.searchParams.set('page', 'admin');
      frame.src = target.toString();
      frame.hidden = false;
      status.style.display = 'none';
    }).catch(error => {
      status.classList.add('error');
      status.textContent = 'เปิดหน้าจัดการหลักสูตรไม่สำเร็จ: ' + error.message;
    });
  })();
  </script>
</body>
</html>
